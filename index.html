<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>玉夫人｜翡翠玉石管理</title><meta name="theme-color" content="#176b57"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#18322b;--muted:#708079;--jade:#176b57;--jade2:#dcece5;--line:#e6e8e3;--danger:#b44747;--gold:#a67c36;--shadow:0 8px 28px rgba(25,58,48,.08)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:86px}header{padding:22px 18px 12px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:22px}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}.pill{background:var(--jade2);color:var(--jade);border:0;border-radius:999px;padding:9px 12px;font-weight:700}.page{display:none;padding:0 16px}.page.active{display:block}.hero{background:linear-gradient(135deg,#174e41,#1e7961);color:white;border-radius:24px;padding:22px;box-shadow:var(--shadow)}.hero .label{opacity:.75;font-size:13px}.hero .big{font-size:36px;font-weight:800;margin:6px 0}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,1fr);margin:12px 0}.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.02)}.stat .v{font-size:22px;font-weight:800;margin-top:6px}.muted{color:var(--muted);font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px;font-weight:800}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:700;background:var(--jade);color:#fff}.btn.secondary{background:var(--jade2);color:var(--jade)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#f8e7e7;color:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap}.form{display:grid;gap:13px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 3px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px;outline:none}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:13px}.chip.on{background:var(--jade);color:#fff;border-color:var(--jade)}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos.four{grid-template-columns:repeat(4,1fr)}.photoBox{aspect-ratio:1;background:#eef0ed;border:1px dashed #bac6c0;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;color:var(--muted);font-size:12px;text-align:center}.photoBox img{width:100%;height:100%;object-fit:cover}.photoBox input{position:absolute;inset:0;opacity:0}.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.product{padding:0;overflow:hidden}.product .pic{aspect-ratio:1.15;background:#edf1ee;display:flex;align-items:center;justify-content:center;color:#87938e}.product .pic img{width:100%;height:100%;object-fit:cover}.product .body{padding:12px}.product .code{font-size:11px;color:var(--muted)}.product .name{font-weight:800;margin:4px 0}.tag{display:inline-block;background:var(--jade2);color:var(--jade);padding:4px 7px;border-radius:8px;font-size:11px;margin-right:4px}.tag.sold{background:#eee;color:#777}.list{display:grid;gap:8px}.row{display:flex;gap:12px;align-items:center}.row .thumb{width:54px;height:54px;border-radius:12px;background:#edf1ee;overflow:hidden;flex:0 0 auto}.thumb img{width:100%;height:100%;object-fit:cover}.grow{flex:1}.money{font-weight:800}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.nav button{border:0;background:transparent;color:#738079;font-size:10px;min-width:54px}.nav button b{display:block;font-size:20px;margin-bottom:2px}.nav button.on{color:var(--jade)}dialog{border:0;border-radius:20px;width:min(92vw,560px);max-height:85vh;padding:0;box-shadow:0 30px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(10,20,17,.45)}.modal{padding:20px;position:relative}.modal h3{margin-top:0;padding-right:44px}.modal-close{position:absolute;right:14px;top:12px;width:38px;height:38px;border:0;border-radius:50%;background:#eef2ef;color:#18322b;font-size:22px;line-height:38px;font-weight:700}.kpi-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}canvas{width:100%;height:180px}.empty{text-align:center;color:var(--muted);padding:30px 12px}.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.toast{position:fixed;z-index:99;left:50%;bottom:95px;transform:translateX(-50%);background:#18322b;color:white;padding:11px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.split{display:grid;gap:12px}.warning{background:#fff5df;color:#7b5a1e;padding:12px;border-radius:12px;font-size:12px}.tiny{font-size:11px}.right{text-align:right}@media(max-width:650px){.photos.four{grid-template-columns:repeat(2,1fr)}}@media(min-width:760px){.app{padding-bottom:24px}.nav{position:sticky;top:0;bottom:auto;max-width:760px;margin:0 auto 18px;border:1px solid var(--line);border-radius:18px;padding:8px}.page{padding:0 24px}.stats{grid-template-columns:repeat(4,1fr)}.product-grid{grid-template-columns:repeat(4,1fr)}.split{grid-template-columns:1fr 1fr}.hero{padding:28px}.hero .big{font-size:44px}}
</style></head><body><div class="app"><header><div class="brand">玉夫人 <small>翡翠・玉石作品管理</small></div><button class="pill" onclick="openQuick()">＋ 快速新增</button></header>
<nav class="nav" id="nav"></nav>
<main>
<section class="page active" id="home"><div class="hero"><div class="label">本月毛利</div><div class="big" id="monthProfit">$0</div><div id="monthSub">營業額 $0 ・ 毛利率 0%</div></div><div class="grid stats" id="stats"></div><div class="section-title"><span>近 6 個月營業額 / 毛利</span></div><div class="card"><canvas id="chart" width="700" height="220"></canvas></div><div class="section-title"><span>庫存提醒</span><span class="muted" id="stockCount"></span></div><div class="card" id="aging"></div><div class="section-title"><span>最近銷售</span></div><div class="list" id="recentSales"></div></section>
<section class="page" id="purchases"><div class="section-title"><span>進貨紀錄</span><button class="btn" onclick="purchaseDialog.showModal()">＋進貨</button></div><div class="card"><div class="muted">累積進貨金額</div><div class="stat"><div class="v" id="purchaseTotal">$0</div></div></div><div class="list" id="purchaseList" style="margin-top:12px"></div></section>
<section class="page" id="products"><div class="section-title"><span>作品 / 庫存</span><button class="btn" onclick="openProduct()">＋作品</button></div><input class="search" id="productSearch" placeholder="搜尋名稱、編號、顏色…" oninput="renderProducts()"><div class="chips" id="productFilters" style="margin-bottom:12px"></div><div class="product-grid" id="productGrid"></div></section>
<section class="page" id="sales"><div class="section-title"><span>銷售訂單</span><button class="btn" onclick="openSale()">＋銷售</button></div><div class="list" id="saleList"></div></section>
<section class="page" id="customers"><div class="section-title"><span>客戶</span><button class="btn" onclick="customerDialog.showModal()">＋客戶</button></div><input class="search" id="customerSearch" placeholder="搜尋姓名、LINE、電話…" oninput="renderCustomers()"><div class="list" id="customerList"></div><div class="section-title"><span>資料與備份</span></div><div class="card actions"><button class="btn secondary" onclick="exportData()">匯出備份</button><label class="btn ghost">匯入備份<input type="file" accept="application/json" hidden onchange="importData(this.files[0])"></label><button class="btn danger" onclick="resetDemo()">清空全部資料</button></div><div class="warning" style="margin-top:10px">目前版本資料儲存在這台裝置的瀏覽器。正式上線給 iPhone 與 iMac 共用時，需接雲端資料庫；本版可先完整測試操作流程。</div></section>
</main></div><div class="toast" id="toast"></div>
<dialog id="purchaseDialog"><form class="modal form" onsubmit="savePurchase(event)"><button class="modal-close" type="button" onclick="purchaseDialog.close()" aria-label="關閉">×</button><h3>新增進貨</h3><div class="split"><div class="field"><label>進貨日期</label><input id="puDate" type="date" required></div><div class="field"><label>類型</label><select id="puType"><option>翡翠</option><option>玉</option><option>珠子／材料</option><option>配件</option><option>其他</option></select></div></div><div class="field"><label>項目名稱</label><input id="puName" required placeholder="例：冰種翡翠散珠"></div><div class="split"><div class="field"><label>進貨價格</label><input id="puPrice" type="number" min="0" inputmode="numeric" required></div><div class="field"><label>數量（僅紀錄）</label><input id="puQty" type="number" min="1" value="1"></div></div><div class="field"><label>進貨照片</label><div class="photos"><label class="photoBox" id="puPhotoBox">📷 拍照／選照片<input id="puPhoto" type="file" accept="image/*" capture="environment" onchange="preview(this,'puPhotoBox')"></label></div></div><div class="field"><label>備註</label><textarea id="puNote" rows="2"></textarea></div><div class="actions"><button class="btn" type="submit">儲存進貨</button><button class="btn ghost" type="button" onclick="purchaseDialog.close()">取消</button></div></form></dialog>
<dialog id="productDialog"><form class="modal form" onsubmit="saveProduct(event)"><button class="modal-close" type="button" onclick="productDialog.close()" aria-label="關閉">×</button><h3 id="productTitle">新增作品</h3><input type="hidden" id="prId"><div class="split"><div class="field"><label>作品類別</label><select id="prType" required><option>手串</option><option>手鐲</option><option>戒指</option><option>墜子</option><option>裸石／蛋面</option><option>珠子／材料</option><option>配件</option><option>其他</option></select></div><div class="field"><label>完成日期</label><input id="prDate" type="date" required></div></div><div class="field"><label>作品名稱</label><input id="prName" required placeholder="例：紫羅蘭翡翠手串"></div><div class="field"><label>作品總成本（自行判斷）</label><input id="prCost" type="number" min="0" inputmode="numeric" required></div><div class="field"><label>作品照片（點格子即可拍照或從相簿選取）</label><div class="photos four"><label class="photoBox" id="p1b">📷 正面<input id="p1" type="file" accept="image/*" capture="environment" onchange="preview(this,'p1b')"></label><label class="photoBox" id="p2b">📷 背面<input id="p2" type="file" accept="image/*" capture="environment" onchange="preview(this,'p2b')"></label><label class="photoBox" id="p3b">📷 細節<input id="p3" type="file" accept="image/*" capture="environment" onchange="preview(this,'p3b')"></label><label class="photoBox" id="p4b">📷 其他／證書<input id="p4" type="file" accept="image/*" capture="environment" onchange="preview(this,'p4b')"></label></div></div><div class="field"><label>種水</label><select id="prWater"><option>未設定</option><option>玻璃</option><option>冰</option><option>糯冰</option><option>糯</option><option>豆</option><option>其他</option></select></div><div class="field"><label>主要顏色</label><select id="prColor"><option>未設定</option><option>綠</option><option>紫</option><option>白</option><option>黃</option><option>紅</option><option>墨</option><option>多色</option><option>其他</option></select></div><div class="field"><label>瑕疵</label><select id="prFlaw"><option>無明顯</option><option>棉</option><option>紋</option><option>裂</option><option>黑點</option><option>其他</option></select></div><div class="field"><label>作品評級</label><select id="prGrade"><option>S</option><option selected>A</option><option>B</option><option>C</option></select></div><div class="field"><label>備註</label><textarea id="prNote" rows="2"></textarea></div><div class="actions"><button class="btn" type="submit">儲存作品</button><button class="btn ghost" type="button" onclick="productDialog.close()">取消</button></div></form></dialog>
<dialog id="customerDialog"><form class="modal form" onsubmit="saveCustomer(event)"><button class="modal-close" type="button" onclick="customerDialog.close()" aria-label="關閉">×</button><h3>新增客戶</h3><div class="field"><label>姓名 / 暱稱</label><input id="cuName" required></div><div class="field"><label>LINE 名稱</label><input id="cuLine"></div><div class="field"><label>電話（選填）</label><input id="cuPhone" inputmode="tel"></div><div class="field"><label>客戶來源</label><select id="cuSource"><option>LINE</option><option>Instagram</option><option>Facebook</option><option>直播</option><option>朋友介紹</option><option>實體</option><option>其他</option></select></div><div class="field"><label>備註</label><textarea id="cuNote" rows="2"></textarea></div><div class="actions"><button class="btn" type="submit">儲存客戶</button><button class="btn ghost" type="button" onclick="customerDialog.close()">取消</button></div></form></dialog>
<dialog id="saleDialog"><form class="modal form" onsubmit="saveSale(event)"><button class="modal-close" type="button" onclick="saleDialog.close()" aria-label="關閉">×</button><h3>新增銷售</h3><div class="field"><label>售出日期</label><input id="saDate" type="date" required></div><div class="field"><label>客戶</label><select id="saCustomer" required></select></div><div class="field"><label>選擇商品（可複選）</label><div id="saleProducts" class="list"></div></div><div class="field"><label>訂單總售價</label><input id="saPrice" type="number" min="0" inputmode="numeric" required></div><div class="muted" id="saleCalc">選擇商品後自動顯示成本</div><div class="actions"><button class="btn" type="submit">完成銷售</button><button class="btn ghost" type="button" onclick="saleDialog.close()">取消</button></div></form></dialog>
<dialog id="detailDialog"><div class="modal"><button class="modal-close" type="button" onclick="detailDialog.close()" aria-label="關閉">×</button><div id="detailContent"></div></div></dialog>
<script>
const $=id=>document.getElementById(id), KEY='jade_manager_v1';let db=load(),filter='全部';
const types={手串:'BR',手鐲:'BG',戒指:'RG',墜子:'PD','裸石／蛋面':'ST','珠子／材料':'MT',配件:'AC',其他:'OT'};const navs=[['home','⌂','首頁'],['purchases','↓','進貨'],['products','◇','作品'],['sales','＄','銷售'],['customers','♙','客戶']];
function empty(){return{purchases:[],products:[],customers:[],sales:[],seq:{}}}function load(){try{return Object.assign(empty(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return empty()}}function persist(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}function money(n){return '$'+Math.round(+n||0).toLocaleString('zh-TW')}function today(){return new Date().toISOString().slice(0,10)}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600)}
function init(){ $('nav').innerHTML=navs.map((n,i)=>`<button class="${i?'':'on'}" onclick="go('${n[0]}',this)"><b>${n[1]}</b>${n[2]}</button>`).join(''); ['puDate','prDate','saDate'].forEach(x=>$(x).value=today()); renderAll()}function go(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');window.scrollTo(0,0)}
async function fileData(f){if(!f)return'';return new Promise(r=>{let im=new Image,fr=new FileReader;fr.onload=e=>{im.onload=()=>{let c=document.createElement('canvas'),max=900,s=Math.min(1,max/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};im.src=e.target.result};fr.readAsDataURL(f)})}async function preview(inp,box){if(inp.files[0]){$(box).innerHTML=`<img src="${await fileData(inp.files[0])}"><input id="${inp.id}" type="file" accept="image/*" capture="environment" onchange="preview(this,'${box}')">`}}
async function savePurchase(e){e.preventDefault();db.purchases.unshift({id:uid(),date:$('puDate').value,type:$('puType').value,name:$('puName').value,price:+$('puPrice').value,qty:+$('puQty').value||1,note:$('puNote').value,photo:await fileData($('puPhoto')?.files?.[0])});persist();e.target.reset();$('puDate').value=today();purchaseDialog.close();toast('進貨已儲存')}
function codeFor(type,date){let d=date.replaceAll('-','').slice(2),k=type+'-'+d,seq=(db.seq[k]||0)+1;db.seq[k]=seq;return `${types[type]||'OT'}-${d}-${String(seq).padStart(3,'0')}`}
function openProduct(id=''){let p=db.products.find(x=>x.id===id);$('productTitle').textContent=p?'編輯作品':'新增作品';$('prId').value=p?.id||'';$('prType').value=p?.type||'手串';$('prDate').value=p?.date||today();$('prName').value=p?.name||'';$('prCost').value=p?.cost||'';$('prWater').value=p?.water||'未設定';$('prColor').value=p?.color||'未設定';$('prFlaw').value=p?.flaw||'無明顯';$('prGrade').value=p?.grade||'A';$('prNote').value=p?.note||'';['p1b','p2b','p3b','p4b'].forEach((b,i)=>{$(b).innerHTML=(p?.photos?.[i]?`<img src="${p.photos[i]}">`:['📷 正面','📷 背面','📷 細節','📷 其他／證書'][i])+`<input id="p${i+1}" type="file" accept="image/*" capture="environment" onchange="preview(this,'${b}')">`});productDialog.showModal()}
async function saveProduct(e){e.preventDefault();let id=$('prId').value,p=db.products.find(x=>x.id===id),photos=[];for(let i=1;i<=4;i++)photos.push(await fileData($('p'+i)?.files?.[0])||p?.photos?.[i-1]||'');let obj={id:id||uid(),code:p?.code||codeFor($('prType').value,$('prDate').value),type:$('prType').value,date:$('prDate').value,name:$('prName').value,cost:+$('prCost').value,photos,water:$('prWater').value,color:$('prColor').value,flaw:$('prFlaw').value,grade:$('prGrade').value,note:$('prNote').value,status:p?.status||'庫存'};if(p)Object.assign(p,obj);else db.products.unshift(obj);persist();productDialog.close();toast(id?'作品已更新':'作品已建立：'+obj.code)}
function saveCustomer(e){e.preventDefault();db.customers.unshift({id:uid(),name:$('cuName').value,line:$('cuLine').value,phone:$('cuPhone').value,source:$('cuSource').value,note:$('cuNote').value});persist();e.target.reset();customerDialog.close();toast('客戶已建立')}
function openSale(){let stock=db.products.filter(p=>p.status==='庫存');if(!stock.length){toast('目前沒有可銷售的庫存作品');return}if(!db.customers.length){toast('請先建立客戶');go('customers',document.querySelectorAll('.nav button')[4]);return}$('saDate').value=today();$('saPrice').value='';$('saCustomer').innerHTML=db.customers.map(c=>`<option value="${c.id}">${esc(c.name)} ・ ${esc(c.source)}</option>`).join('');$('saleProducts').innerHTML=stock.map(p=>`<label class="card row"><input type="checkbox" name="saleProduct" value="${p.id}" onchange="calcSale()"><div class="thumb">${p.photos?.[0]?`<img src="${p.photos[0]}">`:''}</div><div class="grow"><b>${esc(p.name)}</b><div class="tiny muted">${p.code} ・ 成本 ${money(p.cost)}</div></div></label>`).join('');calcSale();saleDialog.showModal()}
function calcSale(){let ids=[...document.querySelectorAll('[name=saleProduct]:checked')].map(x=>x.value),cost=db.products.filter(p=>ids.includes(p.id)).reduce((a,b)=>a+b.cost,0);$('saleCalc').textContent=`已選 ${ids.length} 件 ・ 商品成本 ${money(cost)}`}
function saveSale(e){e.preventDefault();let ids=[...document.querySelectorAll('[name=saleProduct]:checked')].map(x=>x.value);if(!ids.length){toast('請至少選擇一件商品');return}let cost=db.products.filter(p=>ids.includes(p.id)).reduce((a,b)=>a+b.cost,0),price=+$('saPrice').value;let order={id:uid(),no:'SO-'+$('saDate').value.replaceAll('-','').slice(2)+'-'+String(db.sales.length+1).padStart(3,'0'),date:$('saDate').value,customerId:$('saCustomer').value,productIds:ids,price,cost,status:'完成'};db.sales.unshift(order);db.products.forEach(p=>{if(ids.includes(p.id))p.status='已售'});persist();saleDialog.close();toast('銷售完成 ・ 毛利 '+money(price-cost))}
function refund(id){let s=db.sales.find(x=>x.id===id);if(!s||s.status==='退貨')return;if(!confirm('確定整筆訂單退貨？商品將重新回到庫存，營業額與毛利會沖回。'))return;s.status='退貨';db.products.forEach(p=>{if(s.productIds.includes(p.id))p.status='庫存'});persist();detailDialog.close();toast('退貨完成')}
function renderAll(){renderHome();renderPurchases();renderProducts();renderSales();renderCustomers()}
function activeSales(){return db.sales.filter(s=>s.status==='完成')}function renderHome(){let now=new Date(),ym=today().slice(0,7),sales=activeSales(),ms=sales.filter(s=>s.date.startsWith(ym)),rev=ms.reduce((a,b)=>a+b.price,0),prof=ms.reduce((a,b)=>a+b.price-b.cost,0);$('monthProfit').textContent=money(prof);$('monthSub').textContent=`營業額 ${money(rev)} ・ 毛利率 ${rev?Math.round(prof/rev*100):0}%`;let startWeek=new Date(now);startWeek.setDate(now.getDate()-((now.getDay()+6)%7));let week=startWeek.toISOString().slice(0,10),half=new Date(now);half.setMonth(now.getMonth()-6);let year=String(now.getFullYear());let kp=[['本週毛利',sales.filter(s=>s.date>=week).reduce((a,b)=>a+b.price-b.cost,0)],['半年毛利',sales.filter(s=>s.date>=half.toISOString().slice(0,10)).reduce((a,b)=>a+b.price-b.cost,0)],['今年毛利',sales.filter(s=>s.date.startsWith(year)).reduce((a,b)=>a+b.price-b.cost,0)],['庫存成本',db.products.filter(p=>p.status==='庫存').reduce((a,b)=>a+b.cost,0)]];$('stats').innerHTML=kp.map(x=>`<div class="card stat"><div class="muted">${x[0]}</div><div class="v">${money(x[1])}</div></div>`).join('');let stock=db.products.filter(p=>p.status==='庫存');$('stockCount').textContent=stock.length+' 件';let days=p=>Math.floor((Date.now()-new Date(p.date))/(864e5)),a90=stock.filter(p=>days(p)>=90&&days(p)<180).length,a180=stock.filter(p=>days(p)>=180).length;$('aging').innerHTML=`<div class="kpi-line"><span>90–179 天</span><b>${a90} 件</b></div><div class="kpi-line"><span>180 天以上</span><b>${a180} 件</b></div><div class="kpi-line"><span>目前作品庫存</span><b>${stock.length} 件</b></div>`;$('recentSales').innerHTML=sales.slice(0,4).map(s=>saleRow(s)).join('')||'<div class="empty">還沒有銷售紀錄</div>';drawChart()}
function drawChart(){let c=$('chart'),ctx=c.getContext('2d'),months=[];for(let i=5;i>=0;i--){let d=new Date();d.setMonth(d.getMonth()-i);months.push(d.toISOString().slice(0,7))}let vals=months.map(m=>{let s=activeSales().filter(x=>x.date.startsWith(m));return[s.reduce((a,b)=>a+b.price,0),s.reduce((a,b)=>a+b.price-b.cost,0)]}),max=Math.max(1,...vals.flat());ctx.clearRect(0,0,c.width,c.height);ctx.font='12px sans-serif';ctx.fillStyle='#708079';months.forEach((m,i)=>ctx.fillText(m.slice(5)+'月',35+i*105,210));vals.forEach((v,i)=>{let x=38+i*105,w=28,h1=v[0]/max*150,h2=v[1]/max*150;ctx.fillStyle='#b7d5c9';ctx.fillRect(x,185-h1,w,h1);ctx.fillStyle='#176b57';ctx.fillRect(x+30,185-h2,w,h2)});ctx.fillStyle='#708079';ctx.fillText('淺：營業額　深：毛利',10,14)}
function renderPurchases(){$('purchaseTotal').textContent=money(db.purchases.reduce((a,b)=>a+b.price,0));$('purchaseList').innerHTML=db.purchases.map(p=>`<div class="card row"><div class="thumb">${p.photo?`<img src="${p.photo}">`:''}</div><div class="grow"><b>${esc(p.name)}</b><div class="muted tiny">${p.date} ・ ${esc(p.type)} ・ 數量 ${p.qty}</div></div><div class="money">${money(p.price)}</div></div>`).join('')||'<div class="empty">尚無進貨紀錄</div>'}
function renderProducts(){let cats=['全部','庫存','已售','S','A','B','C'];$('productFilters').innerHTML=cats.map(c=>`<button class="chip ${filter===c?'on':''}" onclick="filter='${c}';renderProducts()">${c}</button>`).join('');let q=($('productSearch')?.value||'').toLowerCase(),arr=db.products.filter(p=>(filter==='全部'||p.status===filter||p.grade===filter)&&[p.name,p.code,p.type,p.color,p.water].join(' ').toLowerCase().includes(q));$('productGrid').innerHTML=arr.map(p=>`<div class="card product" onclick="productDetail('${p.id}')"><div class="pic">${p.photos?.[0]?`<img src="${p.photos[0]}">`:'無照片'}</div><div class="body"><div class="code">${p.code}</div><div class="name">${esc(p.name)}</div><span class="tag ${p.status==='已售'?'sold':''}">${p.status}</span><span class="tag">${p.grade}級</span><div class="muted" style="margin-top:7px">成本 ${money(p.cost)}</div></div></div>`).join('')||'<div class="empty">沒有符合條件的作品</div>'}
function productDetail(id){let p=db.products.find(x=>x.id===id);let s=db.sales.find(x=>x.productIds.includes(id)&&x.status==='完成');$('detailContent').innerHTML=`<h3>${esc(p.name)}</h3><div class="photos">${(p.photos||[]).map(x=>`<div class="photoBox">${x?`<img src="${x}">`:'無照片'}</div>`).join('')}</div><div class="kpi-line"><span>商品編號</span><b>${p.code}</b></div><div class="kpi-line"><span>狀態</span><b>${p.status}</b></div><div class="kpi-line"><span>成本</span><b>${money(p.cost)}</b></div><div class="kpi-line"><span>品相</span><b>${p.water}・${p.color}・${p.flaw}</b></div><div class="kpi-line"><span>評級</span><b>${p.grade}</b></div>${s?`<div class="kpi-line"><span>售價</span><b>${money(s.price)}</b></div>`:''}<div class="actions" style="margin-top:15px"><button class="btn" onclick="detailDialog.close();openProduct('${p.id}')">編輯</button><button class="btn ghost" onclick="detailDialog.close()">關閉</button></div>`;detailDialog.showModal()}
function saleRow(s){let c=db.customers.find(x=>x.id===s.customerId);return `<div class="card row" onclick="saleDetail('${s.id}')"><div class="grow"><b>${s.no}</b><div class="muted tiny">${s.date} ・ ${esc(c?.name||'未知客戶')} ・ ${s.productIds.length} 件 ${s.status==='退貨'?'・ 已退貨':''}</div></div><div class="right"><div class="money">${money(s.price)}</div><div class="tiny muted">毛利 ${money(s.price-s.cost)}</div></div></div>`}function renderSales(){$('saleList').innerHTML=db.sales.map(s=>saleRow(s)).join('')||'<div class="empty">尚無銷售訂單</div>'}
function saleDetail(id){let s=db.sales.find(x=>x.id===id),c=db.customers.find(x=>x.id===s.customerId),ps=db.products.filter(p=>s.productIds.includes(p.id));$('detailContent').innerHTML=`<h3>${s.no}</h3><div class="kpi-line"><span>客戶</span><b>${esc(c?.name||'')}</b></div><div class="kpi-line"><span>營業額</span><b>${money(s.price)}</b></div><div class="kpi-line"><span>商品成本</span><b>${money(s.cost)}</b></div><div class="kpi-line"><span>毛利</span><b>${money(s.price-s.cost)}</b></div><div class="section-title">商品</div>${ps.map(p=>`<div class="kpi-line"><span>${esc(p.name)}</span><span>${p.code}</span></div>`).join('')}<div class="actions" style="margin-top:15px">${s.status==='完成'?`<button class="btn danger" onclick="refund('${s.id}')">整筆退貨</button>`:''}<button class="btn ghost" onclick="detailDialog.close()">關閉</button></div>`;detailDialog.showModal()}
function renderCustomers(){let q=($('customerSearch')?.value||'').toLowerCase();let arr=db.customers.filter(c=>[c.name,c.line,c.phone,c.source].join(' ').toLowerCase().includes(q));$('customerList').innerHTML=arr.map(c=>{let s=activeSales().filter(x=>x.customerId===c.id),sum=s.reduce((a,b)=>a+b.price,0);return `<div class="card row" onclick="customerDetail('${c.id}')"><div class="grow"><b>${esc(c.name)}</b><div class="muted tiny">${esc(c.source)}${c.line?' ・ LINE '+esc(c.line):''}</div></div><div class="right"><div class="money">${money(sum)}</div><div class="tiny muted">${s.length} 次購買</div></div></div>`}).join('')||'<div class="empty">尚無客戶</div>'}
function customerDetail(id){let c=db.customers.find(x=>x.id===id),s=activeSales().filter(x=>x.customerId===id),sum=s.reduce((a,b)=>a+b.price,0),items=s.reduce((a,b)=>a+b.productIds.length,0);$('detailContent').innerHTML=`<h3>${esc(c.name)}</h3><div class="kpi-line"><span>來源</span><b>${esc(c.source)}</b></div><div class="kpi-line"><span>累積消費</span><b>${money(sum)}</b></div><div class="kpi-line"><span>購買次數</span><b>${s.length}</b></div><div class="kpi-line"><span>購買件數</span><b>${items}</b></div><div class="kpi-line"><span>平均客單</span><b>${money(s.length?sum/s.length:0)}</b></div><div class="section-title">歷史訂單</div>${s.map(x=>saleRow(x)).join('')||'<div class="empty">尚無購買</div>'}<div class="actions"><button class="btn ghost" onclick="detailDialog.close()">關閉</button></div>`;detailDialog.showModal()}
function openQuick(){$('detailContent').innerHTML=`<h3>快速新增</h3><div class="muted" style="margin:-6px 0 14px">可按右上角 × 或點灰色背景關閉</div><div class="grid"><button class="btn" onclick="detailDialog.close();purchaseDialog.showModal()">新增進貨</button><button class="btn" onclick="detailDialog.close();openProduct()">新增作品</button><button class="btn" onclick="detailDialog.close();openSale()">新增銷售</button><button class="btn secondary" onclick="detailDialog.close();customerDialog.showModal()">新增客戶</button></div>`;detailDialog.showModal()}

document.querySelectorAll('dialog').forEach(d=>{
  d.addEventListener('click',e=>{
    if(e.target===d)d.close();
  });
});

function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='玉夫人備份_'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function importData(f){if(!f)return;let r=new FileReader;r.onload=()=>{try{db=Object.assign(empty(),JSON.parse(r.result));persist();toast('備份已匯入')}catch{alert('備份檔格式不正確')}};r.readAsText(f)}function resetDemo(){if(confirm('確定清空所有資料？建議先匯出備份。')){db=empty();persist();toast('資料已清空')}}function esc(s=''){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}init();
</script></body></html>
